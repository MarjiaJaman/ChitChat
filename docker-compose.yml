services:
  db:
    image: mysql:8.0
    container_name: chitchat-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: chitchat123
      MYSQL_DATABASE: chitchat
      MYSQL_USER: chitchat_user
      MYSQL_PASSWORD: chitchat123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchitchat123"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    container_name: chitchat-backend
    working_dir: /app
    command: sh -c "npm install && npx nodemon server.js"
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    environment:
      DB_HOST: db
      DB_USER: chitchat_user
      DB_PASSWORD: chitchat123
      DB_NAME: chitchat
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: chitchat-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 3000"
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:5001
    depends_on:
      - backend

volumes:
  db_data:
  backend_modules:
  frontend_modules:

